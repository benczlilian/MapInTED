# mapin-ted - site estático. Incluído dentro do bloco http do nginx.conf da base.
# Os marcadores @...@ são preenchidos no build (docker/Dockerfile): este arquivo
# é um modelo, não use direto no nginx.
upstream rgw_s3 {
    server @S3_HOST@;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # IP real do cliente nos logs (perfil da base: confia só nos pods do ingress-nginx).
    include /opt/nginx-confs/realip.conf;

    # Cabeçalhos de segurança (herdados pelas locations, que não usam add_header).
    # Referrer-Policy precisa enviar a origem: as chaves Google/MapTiler são
    # restritas por referrer.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compressão (vale também para o que vem do bucket): GeoJSON e .pbf vêm sem compressão.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/geo+json application/x-protobuf application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # Página principal: sempre revalida (nova versão aparece logo após o deploy).
    location = /index.html {
        expires -1;
    }

    location ~* \.(css|js)$ {
        expires 1h;
    }

    # --- Arquivos no bucket S3 (somente leitura, só GET/HEAD) ---------------
    # Camadas do mapa: tiles PNG/PBF, GeoJSON, GeoTIFF.
    location ^~ /overlays/ {
        limit_except GET HEAD { deny all; }
        expires 30d;
        include /etc/nginx/conf.d/s3-proxy.inc;
        proxy_pass http://rgw_s3/@S3_BUCKET@/@ASSETS_VERSION@/overlays/;
    }

    # Fotos e vídeos: streaming direto (sem arquivo temporário em /tmp) e Range
    # requests repassados ao RGW.
    location ^~ /media/ {
        limit_except GET HEAD { deny all; }
        expires 7d;
        proxy_max_temp_file_size 0;
        include /etc/nginx/conf.d/s3-proxy.inc;
        proxy_pass http://rgw_s3/@S3_BUCKET@/@ASSETS_VERSION@/media/;
    }

    # Nada de arquivos ocultos (.git, .env etc.).
    location ~ /\. {
        return 404;
    }

    # Objeto inexistente no bucket (RGW devolve 403 sem ListBucket).
    location @nao_encontrado {
        return 404;
    }

    # Sondas do Kubernetes (readiness/liveness): não dependem do bucket.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
